info:
  name: 0.2 Login User
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "testuser@flowdesk.com",
        "password": "Password123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Ensure login was successful before extracting the token
        if (res.getStatus() === 200) {
            const data = res.getBody();
            
            // Grabs the token and overwrites the environment placeholder with a fresh session
            bru.setEnvVar("token", data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
